name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Doar Postgres: restul serviciilor se adaugă când au nevoie testele (Realtime, Auth, E2E).
      - run: npx supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npx supabase db reset
      - run: npx supabase test db
      # Erori de schemă și de plpgsql (nu avertismente): CI pică doar la nivel `error`.
      - run: npx supabase db lint --local --level error --fail-on error
      - run: npm run db:types
      - name: Check generated DB types are up to date
        run: |
          if ! git diff --exit-code src/types/database.ts; then
            echo "::error file=src/types/database.ts::DB types are out of date. Run 'npm run db:reset && npm run db:types' and commit src/types/database.ts."
            exit 1
          fi

  migrations-plan:
    # Doar citire: fără secrete, fără acces la cloud. Migrațiile se aplică doar
    # după merge, de deploy.yml (staging automat, producție după aprobare).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check migrations
        run: scripts/check-migrations.sh origin/main
