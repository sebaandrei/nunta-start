name: Deploy database

# Applies supabase/migrations/ to the cloud projects after a merge to main:
#   staging    -> automatically
#   production -> only after manual approval of the GitHub Environment
#                 `production` (required reviewer, configured in repo settings)
#
# NOT gated here: the frontend. Cloudflare Pages deploys it by itself through
# its Git integration, independent of this workflow. Because of that,
# migrations MUST be forward-only (never edit an applied migration, fix with a
# new one) and backward compatible for one release: the previous frontend build
# must keep working against the new schema, and the new build may land before
# or after the migration.
#
# Safety rails: no `--include-all`, no `--include-seed`, never `db reset`
# against a linked project. Secrets/vars are passed only through `env:`.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Where to apply the migrations
        type: choice
        options: [staging, production, both]
        default: both

# Never two migration jobs at once, never cancel one mid-flight.
concurrency:
  group: deploy-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    # Skipped only for a manual run that targets production alone.
    if: github.event_name == 'push' || inputs.target != 'production'
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0 # keep equal to "supabase" in package.json
      - name: Check migration file names
        run: |
          set -eu
          bad=0
          for f in supabase/migrations/*; do
            name=$(basename "$f")
            if ! printf '%s' "$name" | grep -Eq '^[0-9]{14}_[a-z0-9_]+\.sql$'; then
              echo "::error::Invalid migration file name: $name"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ]
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Dry run (what would be applied)
        run: supabase db push --dry-run
      - name: Apply migrations
        run: supabase db push
      - name: Applied versions
        run: supabase migration list

  production:
    # The approval gate waits here (Environment `production`).
    # Runs after staging succeeded, or when staging was skipped on purpose
    # (manual run with target=production). Never runs if staging failed.
    needs: staging
    if: >-
      !cancelled()
      && (needs.staging.result == 'success' || needs.staging.result == 'skipped')
      && (github.event_name == 'push' || inputs.target != 'staging')
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0 # keep equal to "supabase" in package.json
      - name: Check migration file names
        run: |
          set -eu
          bad=0
          for f in supabase/migrations/*; do
            name=$(basename "$f")
            if ! printf '%s' "$name" | grep -Eq '^[0-9]{14}_[a-z0-9_]+\.sql$'; then
              echo "::error::Invalid migration file name: $name"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ]
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Dry run (what would be applied)
        run: supabase db push --dry-run
      - name: Apply migrations
        run: supabase db push
      - name: Applied versions
        run: supabase migration list
